server.port=${SERVER_PORT:8081}
spring.application.name=qr-phishing-detector

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qr_phishing_db}
spring.datasource.username=${DB_USERNAME:qr_detector_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Local synthetic feed - disabled by default
app.feeds.local-test.run-on-startup=${LOCAL_TEST_FEED_RUN_ON_STARTUP:false}
app.feeds.local-test.file=${LOCAL_TEST_FEED_FILE:./dev-data/local-phishing-urls.txt}


# External text feed connector - disabled by default
app.feeds.remote-text.enabled=${REMOTE_TEXT_FEED_ENABLED:false}
app.feeds.remote-text.url=${REMOTE_TEXT_FEED_URL:}
app.feeds.remote-text.allowed-host=${REMOTE_TEXT_FEED_ALLOWED_HOST:}
app.feeds.remote-text.source-key=${REMOTE_TEXT_FEED_SOURCE_KEY:AUTHORISED_PHISHING_FEED}
app.feeds.remote-text.initial-delay-ms=${REMOTE_TEXT_FEED_INITIAL_DELAY_MS:15000}
app.feeds.remote-text.refresh-delay-ms=${REMOTE_TEXT_FEED_REFRESH_DELAY_MS:43200000}

app.redirect-analysis.enabled=${REDIRECT_ANALYSIS_ENABLED:false}

# Prevent internal error details from being exposed to API clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Optional browser sandbox integration; disabled by default
app.sandbox.enabled=${SANDBOX_ENABLED:false}
app.sandbox.gateway-url=${SANDBOX_GATEWAY_URL:http://127.0.0.1:8765}
